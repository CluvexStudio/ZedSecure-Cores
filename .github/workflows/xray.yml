name: xray

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pins.txt
      - singbox-tags.txt
      - scripts/fetch.sh
      - .github/workflows/xray.yml

permissions:
  contents: write

concurrency:
  group: xray
  cancel-in-progress: false

env:
  LDFLAGS: "-checklinkname=0 -s -w -X runtime.godebugDefault=multipathtcp=0,tlssha1=1"

jobs:
  linux-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/fetch.sh vendor/xray-core reference/amneziawg-go reference/sing-openvpn
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          cache-dependency-path: vendor/xray-core/go.sum
      - name: Xray with every protocol for Linux and Windows, plus cronet
        working-directory: vendor/xray-core
        run: |
          set -e
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          TAGS="$(paste -sd, "$GITHUB_WORKSPACE/singbox-tags.txt"),with_purego"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -tags "$TAGS" -ldflags="$LDFLAGS" -o "$out/xray-linux"       ./main
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags "$TAGS" -ldflags="$LDFLAGS" -o "$out/xray-windows.exe" ./main
          go mod download github.com/sagernet/cronet-go/lib/linux_amd64 github.com/sagernet/cronet-go/lib/windows_amd64
          lin=$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)
          win=$(go list -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/windows_amd64)
          [ -n "$lin" ] && [ -n "$win" ] || { echo "::error::cronet modules did not resolve"; exit 1; }
          cp "$lin/libcronet.so"  "$out/"
          cp "$win/libcronet.dll" "$out/"
          "$out/xray-linux" version | head -1
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with: { name: xray-linux-windows, path: dist/*, retention-days: 3 }

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/fetch.sh vendor/xray-core reference/amneziawg-go reference/sing-openvpn
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          cache-dependency-path: vendor/xray-core/go.sum
      - name: Xray with every protocol for macOS, cronet linked in
        working-directory: vendor/xray-core
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CGO_CFLAGS: "-mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0"
        run: |
          set -e
          out="$GITHUB_WORKSPACE/dist"
          bin="$out/xray-macos-${{ matrix.arch }}"
          mkdir -p "$out"
          TAGS="$(paste -sd, "$GITHUB_WORKSPACE/singbox-tags.txt")"
          CGO_ENABLED=1 go build -trimpath -tags "$TAGS" -ldflags="$LDFLAGS" -o "$bin" ./main
          file "$bin"
          minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/{f=1} f&&$1=="minos"{print $2; exit}')
          echo "minimum macOS: $minos"
          [ "$minos" = "12.0" ] || { echo "::error::xray needs macOS $minos, not 12.0"; exit 1; }
          "$bin" version | head -1
      - uses: actions/upload-artifact@v7
        with: { name: "xray-macos-${{ matrix.arch }}", path: dist/*, retention-days: 3 }

  publish:
    needs: [linux-windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish.sh "xray-r${{ github.run_number }}" dist
